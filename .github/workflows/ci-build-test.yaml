name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: cncf-ubuntu-8-32-x86

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Verify
        run: ./gradlew build --info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./client/build/reports/jacoco/test/jacocoTestReport.xml,./perf/build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: true
          # Empty on fork PRs, where the action falls back to a tokenless upload
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Validate Javadoc creation
        run: ./gradlew :client-api:javadoc

      - name: Package test results
        if: failure()
        run: |
          rm -rf test-results
          mkdir test-results
          find . -type d -name "tests" -path "*/build/reports/*" -exec cp --parents -R {} test-results/ \;
          zip -r test-results.zip test-results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results.zip
